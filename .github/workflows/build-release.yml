name: Build and Release

on:
    workflow_dispatch:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

jobs:
    build-linux:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - goarch: amd64
                      filename: amd64
                      container: muslcc/x86_64:x86_64-linux-musl
                      host: ""
                    - goarch: arm64
                      filename: arm64
                      container: muslcc/x86_64:aarch64-linux-musl
                      host: aarch64-linux-musl

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Get tag or commit
              id: ref_id
              shell: bash
              run: |
                  if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                    REF_ID="${GITHUB_REF#refs/tags/}"
                    echo "Triggered by tag: $REF_ID"
                  else
                    REF_ID=$(git rev-parse --short HEAD)
                    echo "No tag detected. Using commit hash: $REF_ID"
                  fi
                  echo "ref=$REF_ID" >> $GITHUB_OUTPUT

            - name: Build in musl container
              run: |
                  mkdir -p dist
                  docker run --rm -i \
                    -v "$PWD:/src" -w /src \
                    -e GOARCH=${{ matrix.goarch }} \
                    -e FILENAME=${{ matrix.filename }} \
                    -e HOST_TRIPLE='${{ matrix.host }}' \
                    -e VERSION='${{ steps.ref_id.outputs.ref }}' \
                    ${{ matrix.container }} \
                    sh -eus <<'EOF'
                  apk update
                  apk add --no-cache git bash tar gzip wget flex bison linux-headers make jq

                  # Resolve the latest Go release
                  GO_DL_JSON=$(wget -qO- 'https://go.dev/dl/?mode=json&include=all') || {
                    echo "error: failed to fetch Go release list from go.dev" >&2
                    exit 1
                  }
                  GO_VERSION=$(printf '%s' "$GO_DL_JSON" \
                    | jq -r '[.[] | select(.stable) | .version | select(startswith("go1.27."))] | first // empty')
                  if [ -z "$GO_VERSION" ]; then
                    echo "error: no stable Go 1.27.x release found on go.dev" >&2
                    exit 1
                  fi
                  echo "Using ${GO_VERSION}"
                  wget -q https://go.dev/dl/${GO_VERSION}.linux-amd64.tar.gz
                  tar -C /usr/local -xzf ${GO_VERSION}.linux-amd64.tar.gz
                  export PATH=$PATH:/usr/local/go/bin
                  git config --global --add safe.directory /src

                  LIBPCAP_VERSION=1.10.6
                  wget -q https://www.tcpdump.org/release/libpcap-${LIBPCAP_VERSION}.tar.gz
                  tar -xzf libpcap-${LIBPCAP_VERSION}.tar.gz
                  cd libpcap-${LIBPCAP_VERSION}
                  [ -n "$HOST_TRIPLE" ] && HOST_FLAG="--host=$HOST_TRIPLE" || HOST_FLAG=""
                  ./configure ${HOST_FLAG} --prefix=/opt/libpcap \
                    --disable-shared --disable-dbus --disable-bluetooth \
                    --disable-usb --with-pcap=linux
                  make -j$(nproc)
                  make install
                  cd ..

                  export CGO_ENABLED=1 GOOS=linux CC=gcc
                  export GIT_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo unknown)
                  export GIT_TAG=$(git describe --tags --exact-match 2>/dev/null || echo unknown)
                  export BUILD_TIME=$(date -u "+%Y-%m-%d %H:%M:%S UTC")
                  export PKG_CONFIG_PATH=/opt/libpcap/lib/pkgconfig
                  export CGO_CFLAGS="-I/opt/libpcap/include"
                  export CGO_LDFLAGS="-L/opt/libpcap/lib -lpcap"

                  [ "$GOARCH" = arm ] && export GOARM=7
                  case "$GOARCH" in mips|mipsle) export GOMIPS=softfloat;; esac
                  case "$GOARCH" in mips64|mips64le) export GOMIPS64=hardfloat;; esac
                  case "$GOARCH" in mips|mipsle|mips64|mips64le) GCFLAGS="";; *) GCFLAGS="all=-l=4";; esac

                  go build -v -a -trimpath \
                    -gcflags "${GCFLAGS}" \
                    -ldflags "-s -w -buildid= -linkmode external -extldflags '-static' \
                    -X 'paqet/cmd/version.Version=${VERSION}' \
                    -X 'paqet/cmd/version.GitCommit=${GIT_COMMIT}' \
                    -X 'paqet/cmd/version.GitTag=${GIT_TAG}' \
                    -X 'paqet/cmd/version.BuildTime=${BUILD_TIME}'" \
                    -o paqet_linux_${FILENAME} ./cmd/main.go

                  chmod +x paqet_linux_${FILENAME}
                  tar -czvf dist/paqet-linux-${FILENAME}-${VERSION}.tar.gz \
                    paqet_linux_${FILENAME} README.md \
                    example/client.yaml.example example/server.yaml.example
                  EOF

            - name: Upload Artifact
              uses: actions/upload-artifact@v7
              with:
                  name: paqet-linux-${{ matrix.filename }}
                  path: dist/paqet-linux-${{ matrix.filename }}-${{ steps.ref_id.outputs.ref }}.tar.gz
                  retention-days: 7

    release:
        runs-on: ubuntu-latest
        needs: [build-linux]
        if: startsWith(github.ref, 'refs/tags/')
        steps:
            - name: Download all build artifacts
              uses: actions/download-artifact@v8
              with:
                  path: ./dist
                  pattern: paqet-*
                  merge-multiple: true

            - name: Create Release
              uses: softprops/action-gh-release@v3
              with:
                  files: dist/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
